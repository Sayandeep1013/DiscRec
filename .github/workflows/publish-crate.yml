name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and build only, don't upload"
        type: boolean
        default: true

jobs:
  publish:
    name: cargo publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Toolchain
        run: rustc -V && cargo -V && cmake --version
      # `cargo publish` builds the packaged crate before uploading, so a
      # dry run proves `cargo install discrec` will compile for users.
      - name: Dry run
        if: inputs.dry_run
        run: cargo publish --dry-run
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
