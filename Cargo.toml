[package]
name = "discrec"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Records Discord's audio. Press record."
license = "MIT"
repository = "https://github.com/Sayandeep1013/DiscRec"

[dependencies]
# Phase 1: raw PCM out to WAV. Pure Rust, no C dependency.
hound = "3.5"

[target.'cfg(windows)'.dependencies]
# Bindings generated from Windows metadata, not SDK headers — this is what
# lets the GNU toolchain reach the process-loopback APIs. See ADR-0009.
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
