[package]
name = "discrec"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Records Discord's audio. Press record."
license = "MIT"
repository = "https://github.com/Sayandeep1013/DiscRec"

[dependencies]
# WAV output, retained for diagnostics and test fixtures. Pure Rust.
hound = "3.5"

# Opus is the shipping format: ~10x smaller than WAV for voice, open, and
# what Discord already uses. Both of these are bindings to C libraries, so
# they are the first dependencies that genuinely need the MinGW compiler
# installed for ADR-0009.
opus = "0.4"
ogg = "0.9"

[target.'cfg(windows)'.dependencies]
# Bindings generated from Windows metadata, not SDK headers â€” this is what
# lets the GNU toolchain reach the process-loopback APIs. See ADR-0009.
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
